<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Draftly - AI Proposal Generator</title>
    <link rel="icon" type="image/png" sizes="48x48" href="/logo-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/logo-16.png" />
    <link rel="shortcut icon" href="/logo-48.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/logo-192.png" />
    <meta name="description" content="Draftly - AI-powered RFP and proposal generator. Create professional proposals in seconds." />
  </head>
  <body>
    <div id="root">
      <!-- Instant shell shown before React boots — replaced once JS runs -->
      <style>
        #root-splash {
          position: fixed; inset: 0;
          background: #070b14;
          display: flex; align-items: center; justify-content: center;
          z-index: 9999;
        }
        .splash-dot {
          width: 8px; height: 8px; border-radius: 50%;
          background: #6366f1;
          animation: splash-pulse 1.2s ease-in-out infinite;
        }
        .splash-dot:nth-child(2) { animation-delay: 0.2s; background: #818cf8; }
        .splash-dot:nth-child(3) { animation-delay: 0.4s; background: #a5b4fc; }
        @keyframes splash-pulse {
          0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
          40% { transform: scale(1); opacity: 1; }
        }
        .splash-dots { display: flex; gap: 10px; }
      </style>
      <div id="root-splash">
        <div class="splash-dots">
          <div class="splash-dot"></div>
          <div class="splash-dot"></div>
          <div class="splash-dot"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
