name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: draftlyacr.azurecr.io
  IMAGE: draftlyacr.azurecr.io/draftly-backend
  RESOURCE_GROUP: habitforge-rg
  CONTAINER_APP_API: draftly-api
  CONTAINER_APP_WORKER: draftly-worker

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: draftly_test
          POSTGRES_USER: rfp_user
          POSTGRES_PASSWORD: rfp_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Enable pgvector extension
        run: |
          PGPASSWORD=rfp_pass psql -h localhost -U rfp_user -d draftly_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Lint
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key
          GOOGLE_AI_API_KEY: dummy
          DATABASE_URL: postgresql://rfp_user:rfp_pass@localhost:5432/draftly_test
          DJANGO_SETTINGS_MODULE: config.test_settings
        run: pytest --tb=short -q

  frontend-test:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm run test:run

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [test, frontend-test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR login
        run: az acr login --name draftlyacr

      - name: Build and push image
        run: |
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest ./backend
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Deploy API
        run: |
          az containerapp update \
            --name $CONTAINER_APP_API \
            --resource-group $RESOURCE_GROUP \
            --image $IMAGE:${{ github.sha }}

      - name: Deploy Worker
        run: |
          az containerapp update \
            --name $CONTAINER_APP_WORKER \
            --resource-group $RESOURCE_GROUP \
            --image $IMAGE:${{ github.sha }}
