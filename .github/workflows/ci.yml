name: CI

on:
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Lint, Test & Audit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: draftly_test
          POSTGRES_USER: rfp_user
          POSTGRES_PASSWORD: rfp_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt pip-audit

      - name: Enable pgvector extension
        run: |
          PGPASSWORD=rfp_pass psql -h localhost -U rfp_user -d draftly_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Lint
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key
          GOOGLE_AI_API_KEY: dummy
          DATABASE_URL: postgresql://rfp_user:rfp_pass@localhost:5432/draftly_test
          DJANGO_SETTINGS_MODULE: config.test_settings
        run: pytest --tb=short -q

      - name: Dependency audit
        working-directory: backend
        run: pip-audit -r requirements.txt --progress-spinner off

  frontend:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm run test:run

      - name: Dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high
