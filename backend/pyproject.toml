[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--reuse-db",
    "--no-migrations",
    "-p", "no:cacheprovider",
]
markers = [
    "integration: requires external services (pgvector, LLM APIs)",
    "slow: takes more than 1 second",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["apps"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/admin.py",
    "*/apps.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations", ".venv", "media", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = [
    "E501",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["E712", "B018"]
"**/settings.py" = ["F405", "F403"]
